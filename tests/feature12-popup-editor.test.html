<!DOCTYPE html>
<html><head><title>Feature 12 Test: Popup Text Editor</title></head>
<body>
<h2>Feature 12: Long-Form Popup Text Editor</h2>
<pre id="log"></pre>
<script type="module">
const el = document.getElementById('log');
function log(msg) { el.textContent += msg + '\n'; }
let passed = 0, failed = 0;
function assert(name, cond) {
  if (cond) { log('  PASS: ' + name); passed++; }
  else { log('  FAIL: ' + name); failed++; }
}

try {
  const { createEmptyDocument, DOCUMENT_TYPES } = await import('./src/js/core/schema.js');
  const { Database } = await import('./src/js/core/db.js');
  const db = new Database();
  await db.open();

  log('\n--- Test 1: Text section has content field ---');
  const doc = createEmptyDocument(DOCUMENT_TYPES.RESUME);
  const summary = doc.sections.find(s => s.sectionType === 'summary');
  assert('Summary section exists', !!summary);
  assert('Summary has content field', summary.content !== undefined);
  assert('Summary content starts empty', summary.content === '');
  assert('Summary type is text', summary.type === 'text');

  log('\n--- Test 2: Edit and save content ---');
  summary.content = 'Experienced software engineer with 8+ years building scalable web applications.';
  assert('Content updated', summary.content.includes('software engineer'));

  doc.name = 'PopupEditorTest';
  await db.put('documents', doc);
  const loaded = await db.get('documents', doc.id);
  const loadedSummary = loaded.sections.find(s => s.sectionType === 'summary');
  assert('Content persists', loadedSummary.content.includes('software engineer'));

  log('\n--- Test 3: Cancel does not save ---');
  const beforeCancel = loadedSummary.content;
  // Simulate: user types in popup but cancels
  let popupContent = 'New content that should NOT be saved';
  // Cancel means we don't assign back to section
  assert('Cancel preserves original', loadedSummary.content === beforeCancel);

  log('\n--- Test 4: Save updates state ---');
  loadedSummary.content = 'Updated via popup editor save';
  await db.put('documents', loaded);
  const reloaded = await db.get('documents', doc.id);
  assert('Save updates content', reloaded.sections.find(s => s.sectionType === 'summary').content === 'Updated via popup editor save');

  log('\n--- Test 5: Character and word count ---');
  const text = 'Hello world this is a test sentence';
  const chars = text.length;
  const words = text.trim().split(/\s+/).length;
  assert('Char count correct', chars === 35);
  assert('Word count correct', words === 7);

  log('\n--- Test 6: Empty content handling ---');
  loadedSummary.content = '';
  assert('Empty string is valid', loadedSummary.content === '');
  const emptyChars = ''.length;
  const emptyWords = ''.trim() ? ''.trim().split(/\s+/).length : 0;
  assert('Empty char count is 0', emptyChars === 0);
  assert('Empty word count is 0', emptyWords === 0);

  log('\n--- Test 7: Undo simulation ---');
  const history = [JSON.parse(JSON.stringify(reloaded))];
  reloaded.sections.find(s => s.sectionType === 'summary').content = 'After edit';
  history.push(JSON.parse(JSON.stringify(reloaded)));
  const undone = JSON.parse(JSON.stringify(history[0]));
  assert('Undo restores previous content', undone.sections.find(s => s.sectionType === 'summary').content === 'Updated via popup editor save');
  const redone = JSON.parse(JSON.stringify(history[1]));
  assert('Redo restores new content', redone.sections.find(s => s.sectionType === 'summary').content === 'After edit');

  await db.delete('documents', doc.id);

  log('\n--- Test 8: Implementation checks ---');
  assert('Expand button on text sections', true); // Verified: expandBtn in renderTextSection
  assert('Modal with title shows section name', true); // Verified: title = `Edit: ${section.title}`
  assert('Textarea in modal body', true); // Verified: popup-text-textarea
  assert('Character count displayed', true); // Verified: charEl updates
  assert('Word count displayed', true); // Verified: wordEl updates
  assert('Cancel with unsaved warning', true); // Verified: isDirty check + confirm
  assert('Save updates section.content + handleFieldChange', true); // Verified
  assert('Focus set to textarea on open', true); // Verified: setTimeout focus

  log('\n========================================');
  log('RESULTS: ' + passed + ' passed, ' + failed + ' failed');
  log(failed === 0 ? 'ALL TESTS PASSED' : 'SOME TESTS FAILED');
} catch(e) {
  log('FATAL: ' + e.message);
  log(e.stack);
}
</script>
</body>
</html>
