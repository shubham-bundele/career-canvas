  <style>
    .app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #475569;
      gap: 1rem;
    }
    .app-loading-logo {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    .app-loading-text { font-size: 0.875rem; }
  </style>

  <div id="app">
    <div class="app-loading" role="status" aria-label="Loading application">

      <div class="app-loading-text">Loading CareerCanvas...</div>
      <div style="font-size:0.6875rem;color:#94a3b8;margin-top:4px">Made by <strong style="color:#64748b">Shubham Bundele</strong></div>
    </div>
  </div>

  <script type="module" src="src/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) { reg.unregister(); }
      });
      caches.keys().then(function(names) {
        for (var name of names) { caches.delete(name); }
      });
    }
  </script>
