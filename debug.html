<!DOCTYPE html>
<html><head><title>Debug</title></head>
<body>
<h2>Module Load Test</h2>
<pre id="log" style="font-size:14px;white-space:pre-wrap;"></pre>
<script>
// Clear all service workers and caches first
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(r => r.forEach(reg => reg.unregister()));
  caches.keys().then(names => names.forEach(n => caches.delete(n)));
}
</script>
<script type="module">
const el = document.getElementById('log');
function log(msg) { el.textContent += msg + '\n'; }

const modules = [
  ['StateManager', './src/js/core/state.js', 'StateManager'],
  ['Database', './src/js/core/db.js', 'Database'],
  ['Router', './src/js/core/router.js', 'Router'],
  ['EventBus', './src/js/core/events.js', 'EventBus'],
  ['Schema', './src/js/core/schema.js', 'createEmptyDocument'],
  ['TemplateEngine', './src/js/core/template-engine.js', 'TemplateEngine'],
  ['Migration', './src/js/core/migration.js', null],
  ['Sanitize', './src/js/utils/sanitize.js', 'escapeHtml'],
  ['Format', './src/js/utils/format.js', 'timeAgo'],
  ['ID', './src/js/utils/id.js', 'generateId'],
  ['Toast', './src/js/modules/toast.js', 'Toast'],
  ['Modal', './src/js/modules/modal.js', 'Modal'],
  ['Dashboard', './src/js/modules/dashboard.js', 'Dashboard'],
  ['Editor', './src/js/modules/editor.js', 'ResumeEditor'],
  ['Onboarding', './src/js/modules/onboarding.js', 'OnboardingWizard'],
  ['TemplateGallery', './src/js/modules/template-gallery.js', 'TemplateGallery'],
  ['DesignPanel', './src/js/modules/design-panel.js', 'DesignPanel'],
  ['ATSChecker', './src/js/modules/ats-checker.js', 'ATSChecker'],
  ['ExportManager', './src/js/modules/export-manager.js', 'ExportManager'],
  ['ImportManager', './src/js/modules/import-manager.js', 'ImportManager'],
  ['MasterProfile', './src/js/modules/master-profile.js', 'MasterProfile'],
  ['Settings', './src/js/modules/settings.js', 'SettingsPanel'],
  ['AppTracker', './src/js/modules/application-tracker.js', 'ApplicationTracker'],
  ['ExpCalc', './src/js/modules/experience-calculator.js', 'ExperienceCalculator'],
  ['SampleData', './src/js/data/sample-data.js', 'sampleResumeData'],
  ['WritingTips', './src/js/data/writing-tips.js', 'writingTips'],
  ['TemplatesIndex', './src/js/templates/index.js', 'registerAllTemplates'],
];

for (const [label, path, exportName] of modules) {
  try {
    const mod = await import(path);
    if (exportName && !mod[exportName]) {
      log('WARN ' + label + ': loaded but "' + exportName + '" not found in exports. Keys: ' + Object.keys(mod).join(', '));
    } else {
      log('OK   ' + label);
    }
  } catch(e) {
    log('FAIL ' + label + ': ' + e.message);
  }
}

log('\n--- Now testing app.js ---');
try {
  await import('./src/js/app.js');
  log('OK   app.js loaded and initialized');
} catch(e) {
  log('FAIL app.js: ' + e.message);
  log('Stack: ' + e.stack);
}
</script>
</body>
</html>
